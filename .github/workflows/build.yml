name: Build Android

on:
  push:
    branches: [ "claude/*", "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Build debug APK
      id: build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --build-cache --no-daemon --init-script .github/gradle/init.gradle.kts 2>&1 | tee build-output.txt
        echo "build_status=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Commit build result
      if: always()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        git fetch origin $BRANCH
        git checkout $BRANCH

        # Write status file
        if [ "${{ steps.build.outputs.build_status }}" = "0" ]; then
          echo "SUCCESS" > .build-status
          rm -f build-log.txt
        else
          echo "FAILURE" > .build-status
          tail -200 build-output.txt > build-log.txt
          git add build-log.txt
        fi

        git add .build-status
        git commit -m "Build #${{ github.run_number }}: ${{ steps.build.outputs.build_status == '0' && 'SUCCESS' || 'FAILURE' }}" || true
        git push origin $BRANCH || true

    - name: Fail if build failed
      if: steps.build.outputs.build_status != '0'
      run: exit 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: steps.build.outputs.build_status == '0'
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
