name: Build Android

on:
  push:
    branches: [ "claude/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      id: build
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
      run: |
        # Retry build up to 3 times in case of network issues
        for i in 1 2 3; do
          echo "=== Build attempt $i ==="
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          if [ $status -eq 0 ]; then
            break
          fi
          if [ $i -lt 3 ]; then
            echo "Build failed, retrying in 30 seconds..."
            sleep 30
          fi
        done
        echo "build_status=$status" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Commit build log on failure
      if: steps.build.outputs.build_status != '0'
      run: |
        # Get last 500 lines to keep it manageable
        tail -500 build-output.txt > build-log.txt
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        # For PRs use head_ref, for pushes use ref_name
        BRANCH="${{ github.head_ref || github.ref_name }}"
        git fetch origin $BRANCH
        git checkout $BRANCH
        git add build-log.txt
        git commit -m "Build failed - log from run #${{ github.run_number }}" || echo "No changes to commit"
        git push origin $BRANCH

    - name: Fail if build failed
      if: steps.build.outputs.build_status != '0'
      run: exit 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: steps.build.outputs.build_status == '0'
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
